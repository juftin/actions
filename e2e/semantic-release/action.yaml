name: semantic-release
description: GitHub Release using semantic-release + gitmoji

inputs:
  python_version:
    description: Python Version to install
    required: true
    default: "3.11"
  github_token:
    description: GitHub Token
    required: true
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Set up Github Workspace
      uses: juftin/actions/checkout@5a54b64fe07d8de40f92676cae6b56c565ec28b2 # v1
      with:
        fetch-depth: 2
    - name: Setup Hatch
      uses: juftin/actions/hatch-setup@5a54b64fe07d8de40f92676cae6b56c565ec28b2 # v1
      with:
        python_version: ${{ inputs.python_version }}
    - name: GitHub Release
      uses: juftin/actions/semantic-release@5a54b64fe07d8de40f92676cae6b56c565ec28b2 # v1
      with:
        github_token: ${{ inputs.github_token }}